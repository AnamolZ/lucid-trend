name: Autonomous 20-Min Social Intel & Shorts Pipeline

on:
  schedule:
    # Trigger every 20 minutes (cron runs at :05, :25, :45 past every hour)
    - cron: '5,25,45 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force extraction and publication immediately'
        required: false
        default: false
        type: boolean

concurrency:
  group: intel-pipeline
  cancel-in-progress: false

jobs:
  extract-and-publish:
    name: Public Intel Scout, OCR & Shorts Publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out lucid-trend
        uses: actions/checkout@v7
        with:
          path: lucid-trend

      - name: Check out news-pluk (Static Delivery Platform)
        uses: actions/checkout@v7
        with:
          repository: AnamolZ/news-pluk
          path: news-pluk
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main

      - name: Install uv (Fast Package Manager)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "lucid-trend/uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies
        working-directory: lucid-trend
        run: uv sync --frozen

      - name: Run Anonymous Intel Extraction Pipeline
        working-directory: lucid-trend
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3.5-super-vl:free' }}
          CLOUDFLARE_ACCOUNTS: ${{ secrets.CLOUDFLARE_ACCOUNTS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          TZ: Asia/Kathmandu
        run: |
          echo "Starting 20-minute anonymous public social intel extraction..."
          uv run python -m service.intel_extractor.pipeline

      - name: Deploy Fresh Shorts & Media to news-pluk CDN
        id: deploy_cdn
        working-directory: news-pluk
        run: |
          git config --global user.name "Anamol"
          git config --global user.email "anmoldkl971@gmail.com"
          git add public/api public/images public/audio
          if git diff --staged --quiet; then
            echo "No new shorts or media generated in this 20-minute cycle."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(shorts): auto-publish latest social intel and visual shorts"
            # Resilient retry loop with rebase and jitter to eliminate push collisions
            pushed=false
            for i in {1..5}; do
              echo "Push attempt $i of 5..."
              git pull --rebase origin main || true
              if git push origin main; then
                pushed=true
                break
              fi
              echo "Push rejected due to concurrent commit, sleeping before retry..."
              sleep $(( (RANDOM % 5) + 3 ))
            done
            if [ "$pushed" = "false" ]; then
              echo "Failed to push after 5 attempts."
              exit 1
            fi
            echo "Successfully deployed fresh shorts to Edge CDN!"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Dispatch Rich Push Notifications to Mobile App
        if: steps.deploy_cdn.outputs.has_changes == 'true'
        working-directory: lucid-trend
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
        run: |
          echo "Waiting 15s for Vercel CDN deployment propagation..."
          sleep 15
          uv run python -c "from service.notifications.push_service import send_latest_dispatches_push; count = send_latest_dispatches_push(limit=1); print(f'Dispatched rich push for {count} articles.')"

      - name: Auto-Prune Old Runs (Retain Exactly Latest 3 Runs)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const token = process.env.GH_TOKEN;
            const repo = process.env.REPO;
            if (!token || !repo) {
              console.log("[WorkflowPruner] No GH_TOKEN or REPO found, skipping.");
              process.exit(0);
            }
            const headers = {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "User-Agent": "WorkflowPruner"
            };
            (async () => {
              try {
                // Fetch previous runs of this specific workflow
                const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/intel_scout_20m.yml/runs?per_page=100`, { headers });
                if (!res.ok) {
                  console.log(`[WorkflowPruner] Failed to fetch runs: ${res.status}`);
                  return;
                }
                const data = await res.json();
                const runs = data.workflow_runs || [];
                // If 3 or fewer runs exist, do not delete any
                if (runs.length <= 3) {
                  console.log(`[WorkflowPruner] Total runs (${runs.length}) <= 3. No pruning needed.`);
                  return;
                }
                // When count reaches 4 or more, keep the latest 3 and prune the older ones
                const toPrune = runs.slice(3);
                console.log(`[WorkflowPruner] Total runs (${runs.length}) > 3. Retaining latest 3, deleting ${toPrune.length} older run(s)...`);
                let deletedCount = 0;
                for (const r of toPrune) {
                  const del = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${r.id}`, { method: "DELETE", headers });
                  if (del.status === 204 || del.status === 200) {
                    deletedCount++;
                  }
                }
                console.log(`[WorkflowPruner] Successfully deleted ${deletedCount} older workflow run(s). Exactly 3 remain.`);
              } catch (err) {
                console.log("[WorkflowPruner] Error:", err.message);
              }
            })();
          '

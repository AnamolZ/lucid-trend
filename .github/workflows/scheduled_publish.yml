name: Autonomous NewsPluk Publishing Engine

on:
  schedule:
    # Autonomous 8-slot 3-hour micro-dispatch cycle (UTC: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00)
    # Primary trigger (:17 past every 3 hours)
    - cron: '17 */3 * * *'
    # Backup/Catch-up trigger (:47 past every 3 hours) to catch dropped or delayed GitHub runner queues
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Target Category to scout & publish (Leave empty for auto-slot resolution)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'Finance'
          - 'Geopolitics'
          - 'Advancement'
      force:
        description: 'Force publish even if slot was already satisfied in last 2 hours'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-pipeline
  cancel-in-progress: false

jobs:
  publish:
    name: Scout, Synthesize, Bake & Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    env:
      NODE_NO_WARNINGS: "1"

    steps:
      - name: Check out lucid-trend
        uses: actions/checkout@v7
        with:
          path: lucid-trend

      - name: Check out news-pluk (Static Delivery Platform)
        uses: actions/checkout@v7
        with:
          repository: AnamolZ/news-pluk
          path: news-pluk
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main

      - name: Install uv (Fast Package Manager)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "lucid-trend/uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies
        working-directory: lucid-trend
        run: uv sync --frozen

      - name: Check Slot Idempotency Guard
        id: check_idempotency
        working-directory: lucid-trend
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          uv run python -c "
          import json, sys, os
          from datetime import datetime, timezone

          event = os.environ.get('EVENT_NAME', '')
          force = os.environ.get('FORCE_RUN', 'false').lower() == 'true'

          if force:
              print('[Idempotency] Force run requested. Proceeding with execution.')
              sys.exit(0)

          feed_path = '../news-pluk/public/api/feed.json'
          if not os.path.exists(feed_path):
              print(f'[Idempotency] {feed_path} not found. Proceeding with execution.')
              sys.exit(0)

          try:
              with open(feed_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              posts = data.get('posts', [])
              if not posts:
                  print('[Idempotency] No posts in feed.json. Proceeding.')
                  sys.exit(0)

              latest_post = posts[0]
              pub_str = latest_post.get('published_at') or latest_post.get('created_at', '')
              if not pub_str:
                  sys.exit(0)

              pub_time = datetime.fromisoformat(pub_str.replace('Z', '+00:00'))
              now = datetime.now(timezone.utc)
              elapsed_hours = (now - pub_time).total_seconds() / 3600.0

              print(f'[Idempotency] Latest post: \"{latest_post.get(\"title\")}\"')
              print(f'[Idempotency] Published: {pub_str} ({elapsed_hours:.2f} hours ago)')

              # If automated cron and an article was published < 2.0 hours ago, skip to prevent duplicates
              if elapsed_hours < 2.0 and event in ['schedule']:
                  print('[Idempotency] Slot already satisfied within the last 2.0 hours. Skipping execution cleanly.')
                  output_path = os.environ.get('GITHUB_OUTPUT')
                  if output_path:
                      with open(output_path, 'a', encoding='utf-8') as out:
                          out.write('skip=true\n')
                  sys.exit(0)

              print('[Idempotency] Slot eligible for new dispatch. Proceeding.')
          except Exception as e:
              print(f'[Idempotency Warning] Check encountered an error ({e}). Proceeding defensively.')
          "

      - name: Execute Publishing Pipeline
        if: steps.check_idempotency.outputs.skip != 'true'
        working-directory: lucid-trend
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNTS: ${{ secrets.CLOUDFLARE_ACCOUNTS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY || 'lt_sec_f30fc7a1ea1603eba5a4c6458f6ec307' }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '90' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SKIP_PUSH_NOTIFICATIONS: "1"
          TZ: Asia/Kathmandu
        run: |
          CATEGORY_INPUT="${{ github.event.inputs.category }}"
          if [ -n "$CATEGORY_INPUT" ]; then
            echo "Running targeted dispatch for category: $CATEGORY_INPUT"
            uv run python main.py --once --category="$CATEGORY_INPUT"
          else
            echo "Running autonomous slot-based micro-dispatch"
            uv run python main.py --once
          fi

      - name: Bake Static CDN Payloads & Audio
        if: steps.check_idempotency.outputs.skip != 'true'
        working-directory: lucid-trend
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          uv run python -c "from service.export.static_baker import bake_static_payloads; res = bake_static_payloads(limit=750, feed_limit=56); print('Baked payloads:', res)"

      - name: Deploy Flat CDN Assets to news-pluk
        if: steps.check_idempotency.outputs.skip != 'true'
        id: deploy_cdn
        working-directory: news-pluk
        run: |
          git config --global user.name "Anamol"
          git config --global user.email "anmoldkl971@gmail.com"
          git add public/api public/images public/audio
          if git diff --staged --quiet; then
            echo "No new static dispatches to deploy."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(cdn): publish new editorial dispatches and baked audio"
            git push origin main
            echo "Successfully deployed new static dispatches to Vercel CDN Edge!"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Dispatch Rich Push Notifications to Mobile App
        if: steps.deploy_cdn.outputs.has_changes == 'true'
        working-directory: lucid-trend
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY || 'newspluk_notify_secret_2026' }}
        run: |
          echo "Waiting 15s for Vercel CDN deployment propagation..."
          sleep 15
          uv run python -c "from service.notifications.push_service import send_latest_dispatches_push; count = send_latest_dispatches_push(limit=1); print(f'Dispatched rich push for {count} articles.')"

      - name: Prune Old Vercel Deployments (Retain Live + 1 Rollback)
        if: steps.deploy_cdn.outputs.has_changes == 'true'
        working-directory: lucid-trend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KEEP_PRODUCTION_COUNT: "2"
        run: |
          uv run python cleanup_vercel.py

      - name: Auto-Prune Old Workflows (Retain Only Latest 5)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const token = process.env.GH_TOKEN;
            const repo = process.env.REPO;
            if (!token || !repo) {
              console.log("[WorkflowPruner] No GH_TOKEN or REPO found, skipping.");
              process.exit(0);
            }
            const headers = {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "User-Agent": "WorkflowPruner"
            };
            (async () => {
              try {
                const res = await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=100`, { headers });
                if (!res.ok) {
                  console.log(`[WorkflowPruner] Failed to fetch runs: ${res.status}`);
                  return;
                }
                const data = await res.json();
                const runs = data.workflow_runs || [];
                if (runs.length <= 5) {
                  console.log(`[WorkflowPruner] Total runs (${runs.length}) <= 5. No pruning needed.`);
                  return;
                }
                const toPrune = runs.slice(5);
                console.log(`[WorkflowPruner] Keeping latest 5 runs. Deleting ${toPrune.length} older run(s)...`);
                let count = 0;
                for (const r of toPrune) {
                  const del = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${r.id}`, { method: "DELETE", headers });
                  if (del.status === 204 || del.status === 200) count++;
                }
                console.log(`[WorkflowPruner] Cleaned up ${count} older workflow run(s). Exactly 5 remain.`);
              } catch (err) {
                console.log("[WorkflowPruner] Error:", err.message);
              }
            })();
          '

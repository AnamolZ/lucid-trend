[project]
name = "lucidtrend"
version = "0.1.0"
description = "LucidTrend is an advanced, fully automated autonomous agent system designed to scout, analyze, and publish high-impact technology news."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=5.0.0",
    "google-adk>=1.19.0",
    "google-generativeai>=0.8.5",
    "huggingface-hub>=1.1.6",
    "pillow>=12.0.0",
    "pymongo>=4.15.4",
    "python-dotenv>=1.2.1",
    "schedule>=1.2.2",
    "celery>=5.3.6",
    "redis>=5.0.1",
]
